<header class="site-header">
  <div class="logo">
    <img class="logo-img" src="/assets/images/logo.png" />
    <a routerLink="/catalog" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">MyShop</a>
  </div>
  <app-search-bar (search)="onSearch($event)"></app-search-bar>
  <div class="user-menu">
    <a *ngIf="!(user$ | async)" routerLink="/signin" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="button">SignIn/SignUp</a>
    <a href="#">Aide</a>
    <button class="cart" (click)="toggleCart()">Panier ({{ cartItemCount }})</button>
    <a *ngIf="user$ | async" routerLink="/profil" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Mon Profil</a>
    <button *ngIf="user$ | async" class="cart" (click)="signOut()">SignOut</button>
  </div>
</header>

<!-- Only render if showCart is true -->
<div *ngIf="showCart">
  <!-- Overlay -->
  <div class="modal-overlay" (click)="toggleCart()"></div>

  <!-- Modal content -->
  <div class="cart-modal">
    <app-shopping-cart></app-shopping-cart>
    <button class="close-btn" (click)="toggleCart()">×</button>
  </div>
</div>
